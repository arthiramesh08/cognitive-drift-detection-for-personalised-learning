{% extends "base.html" %}
{% block title %}Register – LearnFlow AI{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card" style="max-width:480px;">
    <a href="{{ url_for('index') }}" class="auth-logo">
      <div class="icon">🧠</div> LearnFlow AI
    </a>
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Join LearnFlow AI and start your personalized learning journey today.</p>

    <form method="POST" action="{{ url_for('register') }}" novalidate>
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input type="text" id="name" name="name" class="form-control"
               placeholder="e.g. Arthi" required autocomplete="name">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control"
               placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="subject">Primary Subject</label>
        <select id="subject" name="subject" class="form-select">
          <option value="Machine Learning">Machine Learning</option>
          <option value="Python">Python</option>
          <option value="Data Structures">Data Structures</option>
          <option value="Statistics">Statistics</option>
          <option value="Mathematics">Mathematics</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" class="form-control"
                 placeholder="Min. 6 characters" required autocomplete="new-password">
          <button type="button" class="password-toggle">👁️</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <div class="password-wrapper">
          <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                 placeholder="Repeat your password" required autocomplete="new-password">
          <button type="button" class="password-toggle">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg">🚀 Create Account</button>
    </form>

    <p style="text-align:center;margin-top:1.25rem;font-size:.875rem;color:var(--text-secondary);">
      Already have an account?
      <a href="{{ url_for('login') }}" style="font-weight:600;">Sign in →</a>
    </p>
  </div>
</div>
{% endblock %}
